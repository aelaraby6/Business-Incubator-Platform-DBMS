name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Website/package-lock.json

      - name: Install Website Dependencies
        run: |
          cd Website
          npm ci

      - name: Build Web Stylesheet
        run: |
          cd Website
          npm run build:css

  audit-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Business-Incubator-DB-System/Desktop/package-lock.json

      - name: Install Desktop Dependencies
        run: |
          cd Business-Incubator-DB-System/Desktop
          npm ci

      - name: Run ESLint
        run: |
          cd Business-Incubator-DB-System/Desktop
          npm run lint

      - name: Build Desktop Application Frontend
        run: |
          cd Business-Incubator-DB-System/Desktop
          npm run build
